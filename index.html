<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fallgirl</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, #f7fbff 0%, #d9ecff 100%);
        color: #1b2a41;
        position: relative;
      }

      h1 {
        position: absolute;
        left: 50%;
        top: -6rem;
        margin: 0;
        padding: 1.5rem 2rem;
        border: 2px solid #1b2a41;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.75);
        text-align: center;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        line-height: 1.2;
        white-space: nowrap;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <h1 id="falling-title">Hello, I am the girl who's falling.</h1>

    <script>
      const title = document.getElementById('falling-title');

      const state = {
        y: -120,
        x: 0,
        driftVelocity: 0,
        driftTarget: 0,
        rotation: 0,
        rotationVelocity: 0,
        swayPhase: Math.random() * Math.PI * 2,
        nextGustAt: 0,
        lastTime: performance.now()
      };

      function randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function resetFall(now) {
        state.y = -120;
        state.x = randomRange(-80, 80);
        state.driftVelocity = 0;
        state.driftTarget = randomRange(-14, 14);
        state.rotation = randomRange(-6, 6);
        state.rotationVelocity = randomRange(-8, 8);
        state.swayPhase = Math.random() * Math.PI * 2;
        state.nextGustAt = now + randomRange(350, 900);
      }

      function animate(now) {
        const dt = Math.min((now - state.lastTime) / 1000, 0.04);
        state.lastTime = now;

        if (state.y <= -100 || state.y > window.innerHeight + 140) {
          resetFall(now);
        }

        if (now >= state.nextGustAt) {
          state.driftTarget = randomRange(-28, 28);
          state.rotationVelocity += randomRange(-40, 40);
          state.nextGustAt = now + randomRange(250, 800);
        }

        const fallSpeed = 110;
        state.y += fallSpeed * dt;

        const driftResponse = 2.6;
        state.driftVelocity += (state.driftTarget - state.driftVelocity) * driftResponse * dt;

        state.swayPhase += dt * randomRange(2.4, 3.2);
        const featherSway = Math.sin(state.swayPhase) * 24;

        state.x += (state.driftVelocity + featherSway * 0.25) * dt;
        state.x = Math.max(-window.innerWidth * 0.45, Math.min(window.innerWidth * 0.45, state.x));

        state.rotationVelocity *= 0.97;
        state.rotation += state.rotationVelocity * dt + state.driftVelocity * 0.05;
        state.rotation = Math.max(-18, Math.min(18, state.rotation));

        title.style.transform = `translate(${state.x}px, ${state.y}px) rotate(${state.rotation}deg)`;

        requestAnimationFrame(animate);
      }

      resetFall(state.lastTime);
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
