<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fallgirl</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        background: #000;
        color: #f4f8ff;
        position: relative;
      }

      .background-drift {
        position: fixed;
        inset: -8vh -8vw;
        width: 116vw;
        height: 116vh;
        object-fit: cover;
        opacity: 0.42;
        filter: saturate(1.15) brightness(0.68) contrast(1.1);
        pointer-events: none;
        z-index: 0;
        transform-origin: 50% 45%;
        animation: background-sway 13s ease-in-out infinite alternate;
      }

      h1 {
        position: absolute;
        left: 50%;
        top: -6rem;
        margin: 0;
        padding: 1.5rem 2rem;
        border: 2px solid #f4f8ff;
        border-radius: 0.75rem;
        background: rgba(0, 0, 0, 0.55);
        text-align: center;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        line-height: 1.2;
        white-space: nowrap;
        will-change: transform;
        z-index: 3;
      }

      #emoji-layer {
        position: fixed;
        inset: 0;
        pointer-events: auto;
        overflow: hidden;
        z-index: 2;
      }

      .floating-emoji {
        position: absolute;
        bottom: -120px;
        width: clamp(84px, 11vw, 160px);
        height: auto;
        opacity: 0;
        will-change: transform, opacity;
        animation-name: float-up;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
        cursor: pointer;
      }

      .floating-emoji img {
        display: block;
        width: 100%;
        height: auto;
        /* Push near-black values down while lifting highlights for cleaner additive blending. */
        filter: brightness(1.18) contrast(1.5);
        mix-blend-mode: screen;
        mix-blend-mode: plus-lighter;
      }

      .floating-emoji.is-popping {
        animation: bubble-pop 460ms cubic-bezier(0.18, 0.72, 0.2, 1) forwards;
      }

      @keyframes bubble-pop {
        0% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        35% {
          transform: scale(1.22) rotate(4deg);
          opacity: 1;
        }
        100% {
          transform: scale(1.5) rotate(-7deg);
          opacity: 0;
        }
      }

      @keyframes background-sway {
        0% {
          transform: translate3d(-1.8vw, -1vh, 0) scale(1.03) rotate(-1.2deg);
        }
        50% {
          transform: translate3d(1.4vw, 1.4vh, 0) scale(1.07) rotate(1.2deg);
        }
        100% {
          transform: translate3d(-0.6vw, 2.1vh, 0) scale(1.04) rotate(-0.8deg);
        }
      }

      @keyframes float-up {
        0% {
          transform: translate3d(0, 0, 0) scale(var(--size)) rotate(var(--start-rot));
          opacity: 0;
        }
        15% {
          opacity: 0.92;
        }
        100% {
          transform: translate3d(var(--drift), calc(-100vh - 220px), 0) scale(calc(var(--size) * 1.08))
            rotate(calc(var(--end-rot) + var(--spin-turn)));
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <img class="background-drift" src="bgtest.jpg" alt="" aria-hidden="true" />
    <h1 id="falling-title">Hello, I am the girl who's falling.</h1>
    <div id="emoji-layer" aria-hidden="true"></div>

    <script>
      const title = document.getElementById('falling-title');
      const emojiLayer = document.getElementById('emoji-layer');
      const emojiSource = 'IMG_5275 void.jpg';
      let transparentEmojiSource = emojiSource;

      const state = {
        y: -120,
        x: 0,
        driftVelocity: 0,
        driftTarget: 0,
        rotation: 0,
        rotationVelocity: 0,
        swayPhase: Math.random() * Math.PI * 2,
        nextGustAt: 0,
        lastTime: performance.now()
      };

      function randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function resetFall(now) {
        state.y = -120;
        state.x = randomRange(-80, 80);
        state.driftVelocity = 0;
        state.driftTarget = randomRange(-14, 14);
        state.rotation = randomRange(-6, 6);
        state.rotationVelocity = randomRange(-8, 8);
        state.swayPhase = Math.random() * Math.PI * 2;
        state.nextGustAt = now + randomRange(350, 900);
      }

      async function buildTransparentEmojiSource() {
        const sourceImage = new Image();
        sourceImage.decoding = 'async';
        sourceImage.src = emojiSource;

        await sourceImage.decode();

        const canvas = document.createElement('canvas');
        canvas.width = sourceImage.naturalWidth;
        canvas.height = sourceImage.naturalHeight;

        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) return;

        context.drawImage(sourceImage, 0, 0);

        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;

        for (let i = 0; i < pixels.length; i += 4) {
          const red = pixels[i];
          const green = pixels[i + 1];
          const blue = pixels[i + 2];
          const luminance = 0.2126 * red + 0.7152 * green + 0.0722 * blue;

          // Treat very dark pixels as fully transparent and softly fade near-black edges.
          if (luminance <= 20) {
            pixels[i + 3] = 0;
            continue;
          }

          if (luminance < 72) {
            const alpha = Math.round(((luminance - 20) / (72 - 20)) * 255);
            pixels[i + 3] = Math.min(pixels[i + 3], alpha);
          }
        }

        context.putImageData(imageData, 0, 0);
        transparentEmojiSource = canvas.toDataURL('image/png');
      }

      function animate(now) {
        const dt = Math.min((now - state.lastTime) / 1000, 0.04);
        state.lastTime = now;

        if (state.y <= -100 || state.y > window.innerHeight + 140) {
          resetFall(now);
        }

        if (now >= state.nextGustAt) {
          state.driftTarget = randomRange(-28, 28);
          state.rotationVelocity += randomRange(-40, 40);
          state.nextGustAt = now + randomRange(250, 800);
        }

        const fallSpeed = 110;
        state.y += fallSpeed * dt;

        const driftResponse = 2.6;
        state.driftVelocity += (state.driftTarget - state.driftVelocity) * driftResponse * dt;

        state.swayPhase += dt * randomRange(2.4, 3.2);
        const featherSway = Math.sin(state.swayPhase) * 24;

        state.x += (state.driftVelocity + featherSway * 0.25) * dt;
        state.x = Math.max(-window.innerWidth * 0.45, Math.min(window.innerWidth * 0.45, state.x));

        state.rotationVelocity *= 0.97;
        state.rotation += state.rotationVelocity * dt + state.driftVelocity * 0.05;
        state.rotation = Math.max(-18, Math.min(18, state.rotation));

        title.style.transform = `translate(${state.x}px, ${state.y}px) rotate(${state.rotation}deg)`;

        requestAnimationFrame(animate);
      }

      function spawnFloatingEmoji() {
        const emoji = document.createElement('div');
        emoji.className = 'floating-emoji';

        const image = document.createElement('img');
        image.src = transparentEmojiSource;
        image.alt = '';
        image.decoding = 'async';
        image.loading = 'lazy';

        emoji.style.left = `${randomRange(2, 90)}vw`;
        emoji.style.animationDuration = `${randomRange(4.8, 8.5)}s`;
        emoji.style.animationDelay = `${randomRange(0, 0.6)}s`;
        emoji.style.setProperty('--drift', `${randomRange(-130, 130)}px`);
        emoji.style.setProperty('--start-rot', `${randomRange(-18, 18)}deg`);
        emoji.style.setProperty('--end-rot', `${randomRange(-65, 65)}deg`);
        emoji.style.setProperty('--spin-turn', `${randomRange(-0.35, 0.35).toFixed(2)}turn`);
        emoji.style.setProperty('--size', randomRange(0.72, 1.45).toFixed(2));

        emoji.addEventListener('click', () => {
          if (emoji.classList.contains('is-popping')) return;
          emoji.classList.add('is-popping');
          setTimeout(() => emoji.remove(), 430);
        });

        emoji.addEventListener('animationend', () => emoji.remove(), { once: true });
        emoji.appendChild(image);
        emojiLayer.appendChild(emoji);
      }

      async function startScene() {
        try {
          await buildTransparentEmojiSource();
        } catch {
          transparentEmojiSource = emojiSource;
        }

        resetFall(state.lastTime);
        requestAnimationFrame(animate);

        for (let i = 0; i < 8; i += 1) {
          setTimeout(spawnFloatingEmoji, i * 230);
        }
        setInterval(spawnFloatingEmoji, 650);
      }

      startScene();
    </script>
  </body>
</html>
